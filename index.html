<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Generator</title>
    <script>
        function joinTeam(team) {
            alert(`You have joined Team ${team}!`);
        }
    </script>
</head>
<body>
    <h1>Join Your Team</h1>
    <p>Click your name to join one of the two teams:</p>
    <ul>
        <li><button onclick="joinTeam('A')">Alice</button></li>
        <li><button onclick="joinTeam('A')">Bob</button></li>
        <li><button onclick="joinTeam('B')">Charlie</button></li>
        <li><button onclick="joinTeam('B')">David</button></li>
    </ul>
</body>
</html>
