<!DOCTYPE html>
<html>
<head>
  <title>Sunday Match Team Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      padding: 20px; 
      background: #f5f5f5;
    }
    h2 { margin-bottom: 20px; }
    button { 
      padding: 12px 24px; 
      font-size: 18px; 
      cursor: pointer; 
      border: none;
      background: #007bff;
      color: white;
      border-radius: 6px;
    }
    button:hover { background: #0056b3; }
    .team { 
      margin-top: 20px; 
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .team h3 { margin-bottom: 10px; }
    p { margin: 5px 0; }
    .note { margin-top: 20px; font-size: 14px; color: #555; }
  </style>
</head>
<body>
<h2>🏏 Sunday Match Teams (12th April 10:30)</h2>
<div id="result"></div>
<p class="note">⚡ Click once to generate teams</p>
<script>
const players = [
"Buddhika",
"Samuel Tikkanen Hoas Kilo",
"~Jay Patel",
"Dammike. Kilonrinne",
"Noor Hoas Killonrinne",
"Prasad Jayawardane Kilonrinne",
"Bangladesh Guy Committee",
"~Roshan Shrestha",
"Ruwin NC Kilonrinne",
"~EeroS",
"Gihan Malli Hoas Kilonrinne",
"Thilanka Airforce Galaya Friends",
"Suvisal AC Kilonrinne",
"~sajith lakmal"
];

let generated = false;

function generateTeams() {
  if (generated) return;

  generated = true;

  let shuffled = [...players].sort(() => 0.5 - Math.random());

  let teamA = shuffled.slice(0, 7);
  let teamB = shuffled.slice(7);

  let now = new Date().toLocaleString();

  let output = `
  <div class="team">
    <h3>🔵 Team A</h3>
    ${teamA.map(p => `<p>- ${p}</p>`).join("")}
  </div>

  <div class="team">
    <h3>🔴 Team B</h3>
    ${teamB.map(p => `<p>- ${p}</p>`).join("")}
  </div>

  <p><b>Generated at:</b> ${now}</p>
  `;

  document.getElementById("result").innerHTML = output;
}
</script>
</body>
</html>
:::
